<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>t</title>
<script src="https://lib.baomitu.com/vue/3.4.31/vue.global.prod.js"></script>
<script src="https://lib.baomitu.com/vue-demi/0.14.7/index.iife.js"></script>
<script src="https://lib.baomitu.com/element-plus/2.7.2/index.full.min.js"></script>
<script src="https://lib.baomitu.com/pinia/2.3.1/pinia.iife.min.js"></script>
<script src="https://lib.baomitu.com/rxjs/7.8.2/rxjs.umd.min.js"></script>
<script src="https://lib.baomitu.com/blueimp-md5/2.19.0/js/md5.min.js"></script>
<link rel="stylesheet" href="https://lib.baomitu.com/element-plus/2.7.2/index.css">
<style>body{height:100vh;margin:0}</style>
</head>
<body>
<div id="app"></div>
<pre id="err" style="position:fixed;inset:0;background:#fff;color:#c00;font:12px monospace;padding:10px;z-index:99999;white-space:pre-wrap;display:none"></pre>
<script>
window.__errs = [];
window.addEventListener("error", function (e) {
  window.__errs.push("ERROR: " + (e.message || "") + "\n  at " + (e.filename||"") + ":" + (e.lineno||""));
  show();
});
window.addEventListener("unhandledrejection", function (e) {
  window.__errs.push("REJECT: " + e.reason);
  show();
});
function show(){ document.getElementById("err").style.display="block";
  document.getElementById("err").textContent = window.__errs.join("\n\n"); }
// 捕获 vue 挂载异常
var _warn = console.error;
console.error = function(){ window.__errs.push("console.error: " + Array.prototype.join.call(arguments," ")); show(); _warn.apply(console, arguments); };
</script>
<script src="./gm.js"></script>
<script src="./海底小纵队·探矿鲸娘.user.js"></script>
<script>
setTimeout(function(){
  var has = document.querySelector(".main-page");
  var res = "=== RESULT ===\n"
    + "panel .main-page present: " + (has ? "YES" : "NO") + "\n"
    + "body children: " + document.body.children.length + "\n"
    + "errors captured: " + window.__errs.length + "\n\n"
    + window.__errs.join("\n\n");
  document.title = has ? "PASS" : "FAIL";
  var pre = document.createElement("pre");
  pre.id = "res";
  pre.textContent = res;
  pre.style.cssText = "position:fixed;bottom:0;left:0;right:0;max-height:50vh;overflow:auto;background:#111;color:#0f0;font:12px monospace;padding:10px;z-index:99999;white-space:pre-wrap";
  document.body.appendChild(pre);
  window.__RESULT__ = res;
}, 3000);
</script>
</body>
</html>
